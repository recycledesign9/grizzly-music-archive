# ── Shared environment for app and worker ───────────────────────────────────
x-app-env: &app-env
  DB_HOST:          db
  DB_PORT:          3306
  DB_NAME:          ${DB_NAME:-grizzly_db}
  DB_USER:          ${DB_USER:-grizzly}
  DB_PASS:          ${DB_PASS:-grizzly_secret}
  BASE_URL:         ${BASE_URL:-http://localhost:8080}
  ALLOWED_HOSTS:    ${ALLOWED_HOSTS:-localhost,localhost:8080,127.0.0.1,127.0.0.1:8080}
  LASTFM_API_KEY:   ${LASTFM_API_KEY:-}
  DISCOGS_TOKEN:    ${DISCOGS_TOKEN:-}
  YOUTUBE_API_KEY:  ${YOUTUBE_API_KEY:-}
  DEBUG:            ${DEBUG:-false}

  # Internal Docker mapping only. The music-library path is configured
  # exclusively from Grizzly: Settings -> Automatic scan.
  MEDIA_SCAN_HOST_PREFIX: /hostfs


services:

  # ── PHP 8.1 + Apache application ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: grizzly-music-archive:latest

    ports:
      - "${APP_PORT:-8080}:80"

    environment: *app-env

    volumes:
      # Managed covers/audio uploaded by Grizzly.
      #
      # The app container is the single initializer of this shared volume
      # during a fresh installation.
      - uploads_data:/var/www/html/public/uploads

      # Shared runtime area.
      # The web app reads the worker heartbeat and runtime information here.
      #
      # The app container is also the single initializer of this volume.
      - runtime_data:/var/www/html/storage

      # Read-only view of the host filesystem.
      # Users choose the real host path only from Settings.
      - type: bind
        source: /
        target: /hostfs
        read_only: true

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  # ── Watched-folder scanner worker ─────────────────────────────────────────
  # Uses exactly the same application image as the web container.
  #
  # The worker starts only after:
  #   1. MySQL is healthy
  #   2. the app container has started
  #
  # This makes the app the single initializer of the shared named volumes.
  # The worker mounts those volumes with nocopy=true so Docker does not try
  # to copy image contents into the same fresh volume concurrently.
  worker:
    image: grizzly-music-archive:latest

    # The image is built locally by the app service.
    pull_policy: never

    command:
      - php
      - /var/www/html/media-scan-worker.php

    user: "www-data"

    init: true

    environment:
      <<: *app-env

      # media-scan-worker.php uses sys_get_temp_dir() for lock/state.
      # Keeping TMPDIR on a named volume preserves scanner state across
      # container recreation.
      TMPDIR: /var/lib/grizzly-worker

    volumes:
      # Shared uploads volume.
      #
      # app initializes it; worker must only mount and use it.
      - type: volume
        source: uploads_data
        target: /var/www/html/public/uploads
        volume:
          nocopy: true

      # Shared runtime volume containing heartbeat/log/runtime state.
      #
      # nocopy avoids the fresh-install race where app and worker could
      # simultaneously try to initialize /var/www/html/storage/logs.
      - type: volume
        source: runtime_data
        target: /var/www/html/storage
        volume:
          nocopy: true

      # Persistent scanner state and lock.
      # No files from the Docker image need to be copied into this volume.
      - type: volume
        source: worker_state
        target: /var/lib/grizzly-worker
        volume:
          nocopy: true

      # Same read-only host view used by the web application
      # for external audio files.
      - type: bind
        source: /
        target: /hostfs
        read_only: true

    depends_on:
      db:
        condition: service_healthy

      # app initializes uploads_data and runtime_data before worker starts.
      app:
        condition: service_started

    restart: unless-stopped


  # ── MySQL 8.0 database ────────────────────────────────────────────────────
  db:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE:      ${DB_NAME:-grizzly_db}
      MYSQL_USER:          ${DB_USER:-grizzly}
      MYSQL_PASSWORD:      ${DB_PASS:-grizzly_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret_change_me}

    volumes:
      - mysql_data:/var/lib/mysql

      # These scripts run only when the database volume is created
      # for the first time.
      #
      # Upgrade migrations, when provided, are applied manually.
      - ./docker/db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docker/db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

    restart: unless-stopped


# ── Persistent volumes ──────────────────────────────────────────────────────
volumes:
  mysql_data:
  uploads_data:
  runtime_data:
  worker_state: